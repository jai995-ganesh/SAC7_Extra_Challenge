<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAC-7 Extra Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Task Priority</h1>

    <div id="taskCard" class="task-card">
      <h2>Complete Project Task</h2>
      <p>This is a sample task card. Select a priority level below.</p>

      <label for="priority">Priority:</label>
      <select id="priority">
        <option value="LOW">LOW</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="URGENT">URGENT</option>
      </select>

      <p id="selectedPriority">Selected Priority: LOW</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
